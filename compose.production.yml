services:
 app: &app
  build: {context: ., dockerfile: docker/php/Dockerfile}
  restart: unless-stopped
  env_file: .env.production
  volumes: [app-storage:/var/www/html/storage]
  depends_on:
   postgres: {condition: service_healthy}
   redis: {condition: service_healthy}
  healthcheck: {test: ["CMD", "php", "artisan", "about", "--only=environment"], interval: 30s, timeout: 10s, retries: 3}
 nginx:
  build: {context: ., dockerfile: docker/nginx/Dockerfile}
  restart: unless-stopped
  ports: ["80:80"]
  volumes:
   - app-storage:/var/www/html/storage:ro
  depends_on: {app: {condition: service_healthy}}
 worker:
  <<: *app
  command: ["php","artisan","queue:work","redis","--queue=notifications,broadcasts,default","--sleep=1","--tries=3","--backoff=5","--timeout=90","--max-time=3600"]
  healthcheck: {disable: true}
 scheduler:
  <<: *app
  command: ["php","artisan","schedule:work"]
  healthcheck: {disable: true}
 reverb:
  <<: *app
  command: ["php","artisan","reverb:start","--host=0.0.0.0","--port=8080"]
  healthcheck: {disable: true}
 postgres:
  image: postgres:17-alpine
  restart: unless-stopped
  environment: {POSTGRES_DB: "${DB_DATABASE}", POSTGRES_USER: "${DB_USERNAME}", POSTGRES_PASSWORD: "${DB_PASSWORD}"}
  volumes: [postgres-data:/var/lib/postgresql/data]
  healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
 redis:
  image: redis:7.4-alpine
  restart: unless-stopped
  environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
  command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD}"]
  volumes: [redis-data:/data]
  healthcheck: {test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"], interval: 10s, timeout: 5s, retries: 10}
volumes: {app-storage: {}, postgres-data: {}, redis-data: {}}