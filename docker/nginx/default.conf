map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
 listen 80; server_name _; root /var/www/html/public; index index.php;
 client_max_body_size 10m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
 location /app/ { proxy_pass http://reverb:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location / { try_files $uri $uri/ /index.php?$query_string; }
 location ~ \.php$ { limit_req zone=api burst=40 nodelay; try_files $uri =404; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param HTTPS on; fastcgi_pass app:9000; }
 location ~ /\.(?!well-known).* { deny all; }
 location ~* \.(?:env|log|sql|sqlite)$ { deny all; }
}